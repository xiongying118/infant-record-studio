<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>分析检测中心 · 原始记录系统</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- ★ 数据隔离：本工作台与主站、旧独立站的数据完全分开，互不影响。
     但保留 reagentManager.* 不隔离，以便读取同站点试剂效期管理系统的数据。 -->
<script>
(function(){
  try{
    var P="recstudio:", LS=window.localStorage;
    var SHARE=/^reagentManager\./;
    function K(x){ return SHARE.test(String(x)) ? String(x) : P+x; }
    var g=LS.getItem.bind(LS), s=LS.setItem.bind(LS), r=LS.removeItem.bind(LS), k=LS.key.bind(LS);
    var lenGet=Object.getOwnPropertyDescriptor(Storage.prototype,"length").get;
    function rawLen(){ return lenGet.call(LS); }
    function mine(kk){ return !!kk && (kk.indexOf(P)===0 || SHARE.test(kk)); }
    LS.getItem=function(x){ return g(K(x)); };
    LS.setItem=function(x,v){ return s(K(x),v); };
    LS.removeItem=function(x){ return r(K(x)); };
    LS.key=function(i){
      var n=0;
      for(var j=0;j<rawLen();j++){ var kk=k(j);
        if(mine(kk)){
          if(n===i) return kk.indexOf(P)===0 ? kk.slice(P.length) : kk;
          n++;
        } }
      return null;
    };
    Object.defineProperty(LS,"length",{configurable:true,get:function(){
      var n=0; for(var j=0;j<rawLen();j++){ if(mine(k(j))) n++; } return n;
    }});
  }catch(e){}
})();
</script>

<link rel="stylesheet" href="theme.css">
<style>
/* ============================================================
   原始记录系统 · 专属外壳样式
   只做顶栏 / 概览 / 页脚；记录内容由 labbench.js 渲染进 #labBody，
   沿用 theme.css 的 .card / .lr-* 体系，保证 Word 原页与打印不变。
   ============================================================ */
:root{
  --st-navy:#0E2748; --st-navy2:#1B3A6B; --st-navy3:#244E8C;
  --st-gold:#C9A227; --st-gold-soft:#FBF4DC;
  --st-jade:#0E7C6B;
}
html,body{background:var(--bg-grad),var(--bg);background-attachment:fixed}
body{min-height:100vh}

/* 顶栏 */
.st-brand{display:flex;align-items:center;gap:16px;text-align:left}
.st-head{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(118deg,#0C2140 0%,#143258 46%,#1B3A6B 100%);
  border-bottom:3px solid var(--st-gold);
  box-shadow:0 6px 26px rgba(14,39,72,.18);
}
.st-head::before{
  content:"";position:absolute;inset:0;opacity:.5;
  background:
    radial-gradient(560px 260px at 8% -30%,rgba(201,162,39,.20),transparent 62%),
    radial-gradient(520px 300px at 96% 120%,rgba(14,124,107,.22),transparent 60%);
  pointer-events:none;
}
.st-head-in{max-width:1360px;margin:0 auto;padding:20px 30px 18px;position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;flex-wrap:wrap}
.st-logo{
  width:52px;height:52px;flex:0 0 52px;border-radius:14px;
  background:linear-gradient(145deg,var(--st-gold),#E0BE45);
  color:#1A2A12;display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:800;letter-spacing:-1px;
  box-shadow:0 6px 18px rgba(201,162,39,.32),inset 0 1px 0 rgba(255,255,255,.5);
}
.st-title h1{font-size:24px;font-weight:750;letter-spacing:.5px;margin:0;line-height:1.25}
.st-title p{margin:4px 0 0;font-size:12.5px;color:#E4EDF9;letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.st-title p b{color:#F2D97A;font-weight:700}
.st-head-side{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.st-chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
  font-size:12px;color:#E7EEF9;backdrop-filter:blur(4px);
}
.st-chip .dot{width:7px;height:7px;border-radius:50%;background:#4ADE9B;box-shadow:0 0 0 3px rgba(74,222,155,.18)}
.st-ver{font-variant-numeric:tabular-nums;color:#9FB6D6}

/* 概览数据卡 */
.st-stats{max-width:1360px;margin:-1px auto 0;padding:16px 30px 2px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.st-stat{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:14px 18px 13px 20px;box-shadow:var(--sh-1);overflow:hidden;
}
.st-stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st-navy3)}
.st-stat.g::before{background:var(--st-gold)}
.st-stat.j::before{background:var(--st-jade)}
.st-stat .lb{font-size:11.5px;color:var(--ink3);letter-spacing:.4px}
.st-stat .vl{font-size:26px;font-weight:780;color:var(--st-navy);line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.st-stat.g .vl{color:#A9821A}
.st-stat.j .vl{color:var(--st-jade)}
.st-stat .ex{font-size:11px;color:var(--ink3);margin-top:2px}

/* 主体 */
.st-main{max-width:1360px;margin:0 auto;padding:16px 30px 40px}
.st-main .card{border-radius:14px;box-shadow:var(--sh-1)}
.st-main .card:hover{box-shadow:var(--sh-2)}

/* 页脚 */
.st-foot{max-width:1360px;margin:0 auto;padding:6px 30px 26px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:11px;color:var(--ink3)}
.st-foot b{color:var(--ink2);font-weight:600}

/* ★★★ 修复滚动变灰：主站内容包在 .app(z-index:1) 里盖住 body::before 固定渐变层；
   本独立工作台没有 .app 包装，白色卡片会被 body::before(z-index:0) 蒙住泛灰。
   这里显式把顶栏/数据卡/主体/页脚抬到渐变层之上，滚动时不再发灰。 */
.st-head,.st-stats,.st-main,.st-foot{position:relative;z-index:1}

/* ★ 工作台专属：分类/子组未选中标签不再发灰，保持深色清晰；数量角标加深 */
.st-main .lr-grouptab,.st-main .lr-subgroup{color:#233247;font-weight:600}
.st-main .lr-grouptab i,.st-main .lr-subgroup i{color:#334155;opacity:1;font-weight:700}
.st-main .lr-grouptab.on,.st-main .lr-subgroup.on{color:#fff}
.st-main .lr-grouptab.on i,.st-main .lr-subgroup.on i{color:rgba(255,255,255,.92)}
.st-main .lr-grouptab[disabled],.st-main .lr-subgroup[disabled]{opacity:.55;color:#475467}
.st-main .lr-chip{color:#101828;font-weight:600}
.st-main .lr-chip .muted{color:#475467;font-weight:600}
/* ★ 选中态：深字压深蓝底看不清 → 改纯白，单位角标浅白 */
.st-main .lr-chip.on{color:#fff;background:var(--brand);border-color:var(--brand)}
.st-main .lr-chip.on b,.st-main .lr-chip.on .muted{color:#fff;font-weight:700}
.st-main .lr-chip.on input{accent-color:#fff}
/* ★★★ 字体整体放大（正文≈16px，接近常规阅读大小）；Word 原页底图/动态值不在此列，保持复刻原样 */
body{font-size:16px}
.st-main .card-h h3{font-size:17px}
.st-main .card-h .muted{font-size:14px}
.st-main .lr-sub{font-size:14px}
.st-main .lr-chip{font-size:14px}
.st-main .lr-chip .muted{font-size:12px}
.st-main .lr-grouptab{font-size:14px}
.st-main .lr-grouptab i{font-size:12px}
.st-main .lr-subgroup{font-size:13px}
.st-main .lr-subgroup i{font-size:11px}
.st-main .lr-importbar .muted{font-size:13px}
.st-main .lr-rowsel{font-size:14px}
.st-main .lr-rowsel select{font-size:13px}
.st-main .lr-rows th,.st-main .lr-rows td{font-size:13.5px}
.st-main .lr-rows input{font-size:13.5px}
.st-main .lr-solbar summary{font-size:14px}
.st-main .lr-solacts .muted{font-size:12.5px}
.st-main .btn{font-size:13.5px}
.st-stat .lb{font-size:13px}
.st-stat .ex{font-size:12.5px}
.st-stat .vl{font-size:28px}
/* ★ 单双面选择器 */
.lr-printdup{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#233247;font-weight:600;white-space:nowrap}
.lr-printdup select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:#233247;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}

@media(max-width:860px){
  .st-head-in{padding:16px 16px 14px;gap:12px}
  .st-title h1{font-size:18px}
  .st-stats{grid-template-columns:repeat(2,1fr);padding:14px 16px 2px;gap:10px}
  .st-stat{padding:12px 14px 11px 16px}
  .st-stat .vl{font-size:22px}
  .st-main{padding:14px 16px 30px}
  .st-foot{padding:4px 16px 20px}
}
@media(max-width:480px){
  .st-head-side{width:100%;margin-left:0}
  .st-logo{width:44px;height:44px;flex-basis:44px;font-size:21px}
}

/* ★ 居中确认弹窗（替代原生 confirm） */
.lr-mask{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(9,23,45,.56);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.lr-dlg{width:min(560px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;
  box-shadow:0 30px 90px rgba(4,16,38,.42);border:1px solid #E3E9F2;animation:lrDlgIn .18s ease-out}
@keyframes lrDlgIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.lr-dlg-h{display:flex;align-items:center;gap:12px;padding:18px 24px;
  background:linear-gradient(118deg,#0C2140,#1B3A6B);color:#fff;border-radius:16px 16px 0 0;border-bottom:3px solid var(--st-gold)}
.lr-dlg-ic{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
  background:rgba(201,162,39,.18);border:1px solid rgba(201,162,39,.55);border-radius:50%;font-size:21px}
.lr-dlg-h h3{margin:0;font-size:17px;font-weight:750;letter-spacing:.3px}
.lr-dlg-h .lr-dlg-sub{font-size:12px;color:#B9CBE4;margin-top:2px}
.lr-dlg-b{padding:22px 26px 8px;font-size:15px;line-height:1.85;color:#233247}
.lr-dlg-lead{margin:0 0 14px;font-weight:650;color:#B45309}
.lr-dlg-lead .lr-dlg-day{color:#92400E;font-weight:750}
.lr-dlg-list{margin:0 0 16px;padding:12px 16px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px}
.lr-dlg-list ul{margin:0;padding-left:20px}
.lr-dlg-list li{margin:3px 0;color:#78350F}
.lr-dlg-note{margin:0 0 10px;color:#475467}
.lr-dlg-q{margin:6px 0 0;font-weight:700;color:#0E2748}
.lr-dlg-f{display:flex;justify-content:flex-end;gap:12px;padding:16px 26px 22px}
.lr-dlg-btn{padding:10px 24px;border-radius:9px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.15s}
.lr-dlg-btn.ok{background:linear-gradient(145deg,#1B3A6B,#0E2748);color:#fff;box-shadow:0 4px 12px rgba(14,39,72,.28)}
.lr-dlg-btn.ok:hover{filter:brightness(1.12);transform:translateY(-1px)}
.lr-dlg-btn.no{background:#EEF2F7;color:#344054;border-color:#D6DEE9}
.lr-dlg-btn.no:hover{background:#E3E9F2}
@media(max-width:480px){.lr-dlg-b{padding:18px 18px 6px;font-size:14px}.lr-dlg-f{padding:14px 18px 18px}}
</style>
</head>
<body>

<header class="st-head">
  <div class="st-head-in">
    <div class="st-brand">
      <div class="st-logo">记</div>
      <div class="st-title">
        <h1>分析检测中心 · 原始记录系统</h1>
      </div>
    </div>
  </div>
</header>

<section class="st-stats" aria-label="工作台概览">
  <div class="st-stat"><div class="lb">检测项目</div><div class="vl" id="stProj">—</div><div class="ex">覆盖色谱 / 理化 / 原子三组</div></div>
  <div class="st-stat g"><div class="lb">样品清单</div><div class="vl" id="stRows">—</div><div class="ex">可勾选单个或多个样品</div></div>
  <div class="st-stat j"><div class="lb">已选项目</div><div class="vl" id="stSel">—</div><div class="ex">当前操作人可见范围</div></div>
  <div class="st-stat"><div class="lb">待打印份数</div><div class="vl" id="stPrint">—</div><div class="ex">样品数 × 项目数</div></div>
</section>

<main class="st-main">
  <div id="labBody"></div>
</main>

<footer class="st-foot">
  <span>分析检测中心 · 原始记录系统 · 独立运行，数据仅保存在本机浏览器，不上传</span>
  <span>底图源自 Word 原页矢量复刻 · <b>打印前请确认纸张为 A4 纵向、缩放 100%</b></span>
</footer>

<!-- 核心依赖：仅这 5 个 JS，其他模块一律不加载 -->
<script src="store.js?v=20261122d"></script>
<script src="labrecord.js?v=20261122d"></script>
<script src="labpages.js?v=20261122d"></script>
<script src="labauth.js?v=20261122d"></script>
<script src="labbench.js?v=20261122d"></script>

<script>
(function(){
  function boot(){
    if(window.LAB && typeof LAB.go==="function"){
      try{ LAB.go("record"); }catch(e){ console.error(e); }
    }
    /* 顶栏概览：定时同步，跟随勾选/清单变化，不干扰记录区焦点 */
    function upd(){
      try{
        var L=window.LAB; if(!L) return;
        var ps=(window.LABREC&&LABREC.projects)||[];
        var sel=(L.lrSelected&&L.lrSelected())||[];
        var rows=(L.lrRows&&L.lrRows())||[];
        var act=(L.lrActiveRows&&L.lrActiveRows())||[];
        var pc=(L.lrPrintCount&&L.lrPrintCount())||0;
        set("stProj",ps.length); set("stRows",rows.length);
        set("stSel",sel.length); set("stPrint",pc);
        set("stVer",(window.LABREC&&LABREC.v)||"");
      }catch(e){}
    }
    function set(id,v){ var e=document.getElementById(id); if(e) e.textContent=String(v); }
    upd();
    setInterval(upd,1200);
    window.addEventListener("storage",function(){ setTimeout(upd,60); });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
</body>
</html>
